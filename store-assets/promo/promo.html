<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>キミシダイ日記 ストア画像</title>
<style>
  /* 1320x2868（6.9インチ）基準で組み、6.5インチは縮小して書き出す */
  :root {
    --green: #2E6E4E;
    --green-deep: #1F5A3E;
    --ink: #1C1C1E;
    --sub: #55555B;
    --bg: #F3F2F2;
    --grid: rgba(150, 175, 110, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1320px; height: 2868px; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Hiragino Sans", "ヒラギノ角ゴシック", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .canvas {
    position: relative; width: 1320px; height: 2868px; overflow: hidden;
    background:
      radial-gradient(ellipse 900px 700px at 50% 78%, rgba(124, 190, 140, 0.22), transparent 70%),
      linear-gradient(var(--grid) 2px, transparent 2px) 0 0 / 66px 66px,
      linear-gradient(90deg, var(--grid) 2px, transparent 2px) 0 0 / 66px 66px,
      var(--bg);
    transform-origin: top left;
  }
  .copy { position: absolute; top: 210px; left: 0; right: 0; text-align: center; padding: 0 80px; }
  .eyebrow {
    display: inline-block; font-weight: 700; font-size: 46px; letter-spacing: 0.04em;
    color: var(--green); background: #fff; border: 4px solid var(--green);
    border-radius: 999px; padding: 18px 48px 16px;
  }
  .eyebrow.plus { color: #fff; background: var(--green); }
  h1 {
    margin-top: 56px; font-weight: 800; font-size: 148px; line-height: 1.22;
    letter-spacing: 0.01em; font-feature-settings: "palt";
  }
  h1 em { font-style: normal; color: var(--green); }
  .stripe { display: flex; gap: 12px; justify-content: center; margin: 56px auto 0; }
  .stripe i { display: block; width: 92px; height: 16px; border-radius: 8px; }
  .lead {
    margin-top: 52px; font-weight: 600; font-size: 54px; line-height: 1.6;
    color: var(--sub); font-feature-settings: "palt";
  }

  .phone {
    position: absolute; left: 50%; width: 940px; aspect-ratio: 1320 / 2868;
    transform: translateX(-50%);
    border-radius: 140px; background: #111; padding: 26px;
    box-shadow: 0 60px 120px rgba(31, 90, 62, 0.28), 0 0 0 6px #3a3a3c inset;
  }
  .phone img { display: block; width: 100%; height: 100%; border-radius: 116px; object-fit: cover; }

  /* 1枚目（ヒーロー） */
  .hero h1 { font-size: 156px; }
  .hero .copy { z-index: 2; top: 150px; }
  .mascot { display: block; width: 250px; height: auto; margin: 0 auto 40px; filter: drop-shadow(0 16px 24px rgba(31, 90, 62, 0.22)); }
  .badges { display: flex; justify-content: center; gap: 28px; margin-top: 64px; }
  .badge {
    width: 300px; height: 300px; border-radius: 50%; background: #fff;
    border: 6px solid var(--green); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    box-shadow: 0 18px 40px rgba(31, 90, 62, 0.14);
  }
  .badge small { font-size: 40px; font-weight: 700; color: var(--sub); line-height: 1.3; }
  .badge b { font-size: 72px; font-weight: 800; color: var(--green); line-height: 1.15; }
  .pair .phone { width: 760px; }
  .pair .back { left: 33%; transform: translateX(-50%) rotate(-6deg); }
  .pair .front { left: 67%; transform: translateX(-50%) rotate(5deg); }

  /* 6枚目（アカウント不要） */
  .seal {
    position: absolute; right: 60px; top: 1230px; z-index: 2;
    width: 470px; height: 470px; border-radius: 50%; background: #fff;
    border: 8px solid var(--green); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    box-shadow: 0 30px 60px rgba(31, 90, 62, 0.22);
  }
  .seal span { font-size: 66px; font-weight: 800; color: var(--green); line-height: 1.25; }
  .seal hr { width: 300px; border: none; border-top: 6px dotted #9CB98A; margin: 22px 0; }
  .seal b { font-size: 120px; font-weight: 800; line-height: 1; }
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
  const STRIPE = ['#D9482F', '#EF8460', '#D8D8DE', '#7CBE8C', '#1F7A45']
    .map(c => `<i style="background:${c}"></i>`).join('');
  // アプリアイコンのキャラクター（icon.png のドット絵を背景なしで描き直したもの）
  const MASCOT = `<svg class="mascot" viewBox="66 56 268 286" fill="#2E6E4E">
    <path fill-rule="evenodd" d="M88 56h204v162H88z M128 118v40h42v-40z M210 118v40h42v-40z M148 180v20h84v-20z"/>
    <rect x="170" y="218" width="40" height="24"/>
    <rect x="66" y="240" width="268" height="102"/>
    <rect x="312" y="180" width="22" height="62"/>
  </svg>`;
  const shot = name => `../screenshots/6.9/${name}.png`;
  const phone = (name, cls = '', top = 1180) =>
    `<div class="phone ${cls}" style="top:${top}px"><img src="${shot(name)}"></div>`;

  const SLIDES = [
    {
      cls: 'hero pair',
      html: `
        <div class="copy">
          ${MASCOT}
          <div class="eyebrow">1日5問、選ぶだけの振り返り日記</div>
          <h1>今日は<em>自分軸</em>で<br>過ごせた？</h1>
          <div class="badges">
            <div class="badge"><small>1日</small><b>3分</b><small>選ぶだけ</small></div>
            <div class="badge"><small>アカウント<br>登録</small><b>不要</b></div>
            <div class="badge"><small>質問は</small><b>112問</b><small>10テーマ</small></div>
          </div>
        </div>
        ${phone('01-questions', 'back', 1640)}
        ${phone('03-calendar', 'front', 1560)}`,
    },
    {
      html: `
        <div class="copy">
          <div class="eyebrow">1日5問・4段階</div>
          <h1><em>選ぶだけ</em>で<br>3分で終わる</h1>
          <div class="stripe">${STRIPE}</div>
          <p class="lead">毎日届く日替わりの質問に答えるだけ。<br>疲れた日でも、無理なく続けられます。</p>
        </div>
        ${phone('01-questions')}`,
    },
    {
      html: `
        <div class="copy">
          <div class="eyebrow">カレンダー</div>
          <h1>積み重ねが<br><em>色</em>になる</h1>
          <div class="stripe">${STRIPE}</div>
          <p class="lead">自分軸を保てた日は緑に。<br>1か月の流れがひと目でわかります。</p>
        </div>
        ${phone('03-calendar')}`,
    },
    {
      html: `
        <div class="copy">
          <div class="eyebrow">やること</div>
          <h1><em>誰のため</em>の<br>時間だった？</h1>
          <div class="stripe">${STRIPE}</div>
          <p class="lead">終えたことを「自分のため」「家族のため」<br>などで記録。一日の内訳が見えてきます。</p>
        </div>
        ${phone('02-todo')}`,
    },
    {
      html: `
        <div class="copy">
          <div class="eyebrow">軸スコア</div>
          <h1>責めずに、<br><em>ただ</em>ふり返る</h1>
          <div class="stripe">${STRIPE}</div>
          <p class="lead">回答から今日の「軸スコア」を計算。<br>過去の日も、いつでも見返せます。</p>
        </div>
        ${phone('06-day-detail')}`,
    },
    {
      html: `
        <div class="copy">
          <div class="eyebrow">プライバシー</div>
          <h1>あなたの内面は<br><em>どこにも</em><br>送らない</h1>
          <p class="lead">記録はすべてこの端末の中だけ。<br>サーバーにもAIにも送信しません。</p>
        </div>
        <div class="seal"><span>アカウント<br>登録</span><hr><b>不要!</b></div>
        ${phone('04-home-done', '', 1480)}`,
    },
    {
      // 有料機能を載せる1枚。Guideline 2.3.2 に従い、追加購入が必要だと画像内で明示する
      html: `
        <div class="copy">
          <div class="eyebrow plus">プラス（買い切り）の機能</div>
          <h1>1か月の自分を<br><em>ふり返る</em></h1>
          <div class="stripe">${STRIPE}</div>
          <p class="lead">月ごとのレポートで、軸の推移や<br>テーマ別の傾向が見えてきます。</p>
        </div>
        ${phone('07-monthly-report')}`,
    },
  ];

  const params = new URLSearchParams(location.search);
  const slide = SLIDES[Number(params.get('slide') ?? 1) - 1];
  const canvas = document.getElementById('canvas');
  canvas.className = `canvas ${slide.cls ?? ''}`;
  canvas.innerHTML = slide.html;

  // ?w=1284&h=2778 のように指定すると、そのサイズへ縮小して書き出す
  const w = Number(params.get('w') ?? 1320);
  const h = Number(params.get('h') ?? 2868);
  if (w !== 1320) {
    canvas.style.transform = `scale(${w / 1320})`;
    document.documentElement.style.width = document.body.style.width = `${w}px`;
    document.documentElement.style.height = document.body.style.height = `${h}px`;
  }
</script>
</body>
</html>
